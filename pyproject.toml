[project]
name = "toolcall-rescue"
version = "0.1.0"
description = "Recover tool/function calls that local & small LLMs emit as plain text when the structured tool_calls field is empty. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MUSE" }]
keywords = [
    "llm", "slm", "ollama", "tool-calling", "function-calling",
    "agent", "local-llm", "llama-cpp", "vllm", "qwen", "gemma",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # zero runtime dependencies, by design

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/MUSE-CODE-SPACE/toolcall-rescue"
Repository = "https://github.com/MUSE-CODE-SPACE/toolcall-rescue"
Issues = "https://github.com/MUSE-CODE-SPACE/toolcall-rescue/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolcall_rescue"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
